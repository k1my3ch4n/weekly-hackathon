name: CI

on:
  push:
    branches: [main, feature]
    paths:
      - 'fe-lab/**'
      - 'vox-task/**'
      - 'eng-chat/**'
      - 'setup-package/**'
  pull_request:
    branches: [main]
    paths:
      - 'fe-lab/**'
      - 'vox-task/**'
      - 'eng-chat/**'
      - 'setup-package/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      fe-lab: ${{ steps.filter.outputs.fe-lab }}
      vox-task: ${{ steps.filter.outputs.vox-task }}
      eng-chat: ${{ steps.filter.outputs.eng-chat }}
      setup-package: ${{ steps.filter.outputs.setup-package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fe-lab:
              - 'fe-lab/**'
            vox-task:
              - 'vox-task/**'
            eng-chat:
              - 'eng-chat/**'
            setup-package:
              - 'setup-package/**'

  build-fe-lab:
    needs: changes
    if: needs.changes.outputs.fe-lab == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fe-lab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe-lab/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-vox-task:
    needs: changes
    if: needs.changes.outputs.vox-task == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vox-task

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vox-task/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  build-setup-package:
    needs: changes
    if: needs.changes.outputs.setup-package == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: setup-package/create-k1my3ch4n-setup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: setup-package/create-k1my3ch4n-setup/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

  build-eng-chat:
    needs: changes
    if: needs.changes.outputs.eng-chat == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eng-chat

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eng-chat/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck
